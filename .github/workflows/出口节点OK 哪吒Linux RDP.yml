name: 出口节点OK哪吒 Linux

on:
  workflow_dispatch:
    inputs:
      server_password:
        description: 'Server Password'
        required: true
        default: 'MyServer@2025!'
        type: string

jobs:
  secure-server:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: 设置基础环境
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget gnupg net-tools

      - name: 创建管理用户
        run: |
          SERVER_PASSWORD="${{ github.event.inputs.server_password }}"
          sudo useradd -m -s /bin/bash SERVERADMIN 2>/dev/null || true
          echo "SERVERADMIN:$SERVER_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo SERVERADMIN
          echo "SERVER_PASSWORD=$SERVER_PASSWORD" >> $GITHUB_ENV

      - name: 安装 Tailscale
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/debian/bookworm.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update
          sudo apt-get install -y tailscale

      - name: 配置出口节点
        run: |
          # 启用 IP 转发
          echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p
          
          # 检测本地子网
          SUBNET=$(ip route | grep default | awk '{print $3}' | cut -d. -f1-3).0/24
          echo "ADVERTISE_ROUTES=$SUBNET" >> $GITHUB_ENV
          echo "检测到的子网: $SUBNET"

      - name: 建立 Tailscale 连接
        run: |
          # 启动 Tailscale 服务
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-runner-$GITHUB_RUN_ID \
            --advertise-exit-node \
            --advertise-routes=$ADVERTISE_ROUTES
          
          # 等待获取 Tailscale IP
          for i in {1..10}; do
            TAILSCALE_IP=$(tailscale ip -4)
            if [ -n "$TAILSCALE_IP" ]; then
              break
            fi
            sleep 5
          done
          
          if [ -z "$TAILSCALE_IP" ]; then
            echo "错误: 无法获取 Tailscale IP"
            exit 1
          fi
          
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV
          echo "Tailscale IP: $TAILSCALE_IP"

      - name: 安装并修复 KO30RE 服务
        run: |
          # 创建安装目录
          sudo mkdir -p /opt/ko30re
          cd /opt/ko30re

          # 下载脚本并检查内容
          echo "下载 KO30RE 脚本..."
          sudo curl -L https://r2.916919.xyz/ko30re/top.sh -o top.sh
          sudo chmod +x top.sh
          
          # 检查脚本类型并设置正确的解释器
          if head -1 top.sh | grep -q "bash"; then
            echo "检测到 bash 脚本"
          else
            echo "设置 bash 解释器"
            sudo sed -i '1i#!/bin/bash' top.sh
          fi

          # 创建改进的 systemd 服务
          sudo tee /etc/systemd/system/ko30re.service > /dev/null <<EOF
[Unit]
Description=KO30RE Client Service
After=network.target
StartLimitIntervalSec=0

[Service]
Type=simple
User=root
WorkingDirectory=/opt/ko30re
Environment=NZ_SERVER=ko30re.916919.xyz:443
Environment=NZ_TLS=true
Environment=NZ_CLIENT_SECRET=kO3irsfICJvxqZFUE2bVHGbv2YQpd0Re
ExecStart=/bin/bash /opt/ko30re/top.sh
Restart=always
RestartSec=5
StandardOutput=journal
StandardError=journal
TimeoutStopSec=10

[Install]
WantedBy=multi-user.target
EOF

          # 启用并启动服务
          sudo systemctl daemon-reload
          sudo systemctl enable ko30re.service
          sudo systemctl start ko30re.service

          # 等待服务稳定
          sleep 10
          
          echo "KO30RE 服务状态:"
          sudo systemctl status ko30re.service --no-pager

      - name: 监控和调试 KO30RE 服务
        run: |
          # 检查服务状态
          echo "=== 检查 KO30RE 服务状态 ==="
          sudo systemctl status ko30re.service --no-pager
          
          # 检查进程
          echo "=== 检查运行进程 ==="
          ps aux | grep -v grep | grep top.sh && echo "进程运行中" || echo "未找到进程"
          
          # 显示最新日志
          echo "=== KO30RE 服务日志 ==="
          sudo journalctl -u ko30re.service -n 20 --no-pager
          
          # 检查脚本内容
          echo "=== 检查脚本前10行 ==="
          head -10 /opt/ko30re/top.sh

      - name: 验证服务状态
        run: |
          echo "=== 系统服务状态 ==="
          echo "Tailscale 状态:"
          sudo tailscale status
          
          echo "KO30RE 服务状态:"
          sudo systemctl is-active ko30re.service && echo "活跃" || echo "不活跃"
          
          echo "网络连接:"
          netstat -tulpn | grep -E ':(443|3389)' || echo "无相关端口监听"

      - name: 维护连接并显示信息
        run: |
          echo ""
          echo "=== 服务器访问信息 ==="
          echo "Tailscale IP: $TAILSCALE_IP"
          echo "SSH 用户名: SERVERADMIN"
          echo "SSH 密码: $SERVER_PASSWORD"
          echo ""
          echo "=== 出口节点配置 ==="
          echo "出口节点名称: gh-runner-$GITHUB_RUN_ID"
          echo "广告路由: $ADVERTISE_ROUTES"
          echo ""
          echo "=== KO30RE 服务状态 ==="
          sudo systemctl is-active ko30re.service && echo "✓ KO30RE: 运行中" || echo "✗ KO30RE: 未运行"
          echo ""
          echo "启用出口节点步骤:"
          echo "1. 访问 https://login.tailscale.com/admin/machines"
          echo "2. 找到设备 'gh-runner-$GITHUB_RUN_ID'"
          echo "3. 点击 '...' → 编辑路由设置"
          echo "4. 启用 '用作出口节点' 和子网路由"
          echo "===================="
          echo ""
          
          # 持续监控服务状态
          while true; do
            echo "[$(date)] 系统运行中 - Tailscale IP: $TAILSCALE_IP"
            echo "KO30RE 服务状态: $(sudo systemctl is-active ko30re.service)"
            sudo journalctl -u ko30re.service --since "1 minute ago" --no-pager | tail -5
            sleep 60
          done
