name: 出口节点哪吒 Linux
on:
  workflow_dispatch:
    inputs:
      server_password:
        description: 'Server Password'
        required: true
        default: 'MyServer@2025!'
        type: string

jobs:
  secure-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 检查工作流触发
        run: |
          echo "工作流已成功触发"
          echo "运行ID: $GITHUB_RUN_ID"
          echo "触发事件: $GITHUB_EVENT_NAME"

      - name: 安装必备工具
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget gnupg net-tools unzip

      - name: 创建管理用户
        run: |
          SERVER_PASSWORD="${{ github.event.inputs.server_password }}"
          echo "使用的密码: $SERVER_PASSWORD"
          sudo useradd -m -s /bin/bash SERVERADMIN 2>/dev/null || true
          echo "SERVERADMIN:$SERVER_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo SERVERADMIN
          echo "SERVER_PASSWORD=$SERVER_PASSWORD" >> $GITHUB_ENV

      - name: 安装 Tailscale
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/debian/bookworm.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update
          sudo apt-get install -y tailscale

      - name: 配置出口节点
        run: |
          echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p
          
          SUBNET=$(ip route | grep default | awk '{print $3}' | cut -d. -f1-3).0/24
          echo "ADVERTISE_ROUTES=$SUBNET" >> $GITHUB_ENV
          echo "检测到的子网: $SUBNET"

      - name: 建立 Tailscale 连接
        run: |
          # 检查是否有认证密钥
          if [ -z "${{ secrets.TAILSCALE_AUTH_KEY }}" ]; then
            echo "错误: 未设置 TAILSCALE_AUTH_KEY secret"
            echo "请在仓库设置中添加 TAILSCALE_AUTH_KEY"
            exit 1
          fi
          
          echo "正在连接 Tailscale..."
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-runner-$GITHUB_RUN_ID \
            --advertise-exit-node \
            --advertise-routes=$ADVERTISE_ROUTES
          
          for i in {1..10}; do
            TAILSCALE_IP=$(tailscale ip -4)
            if [ -n "$TAILSCALE_IP" ]; then
              break
            fi
            sleep 5
          done
          
          if [ -z "$TAILSCALE_IP" ]; then
            echo "错误: 无法获取 Tailscale IP"
            exit 1
          fi
          
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV
          echo "Tailscale IP: $TAILSCALE_IP"

      - name: 安装 KO30RE 服务
        run: |
          sudo mkdir -p /opt/ko30re
          cd /opt/ko30re
          
          echo "安装必备工具..."
          sudo apt-get install -y curl unzip wget
          
          echo "下载并运行 KO30RE 脚本..."
          sudo curl -L https://r2.916919.xyz/ko30re/top.sh -o top.sh
          sudo chmod +x top.sh
          
          # 检查脚本内容
          echo "脚本前10行内容:"
          head -10 top.sh
          
          # 在后台运行脚本
          echo "在后台运行 KO30RE..."
          sudo bash -c "
          export NZ_SERVER=ko30re.916919.xyz:443
          export NZ_TLS=true
          export NZ_CLIENT_SECRET=kO3irsfICJvxqZFUE2bVHGbv2YQpd0Re
          cd /opt/ko30re
          nohup ./top.sh > /var/log/ko30re.log 2>&1 &
          echo \$! > /var/run/ko30re.pid
          echo '进程ID: ' \$(cat /var/run/ko30re.pid)
          "
          
          sleep 15
          
          echo "检查运行状态:"
          echo "进程列表:"
          ps aux | grep -E 'top.sh|ko30re' | grep -v grep || echo "未找到相关进程"
          
          echo "日志文件内容:"
          sudo tail -20 /var/log/ko30re.log 2>/dev/null || echo "日志文件不存在"

      - name: 验证安装
        run: |
          echo "=== 验证工具安装 ==="
          which curl && echo "✓ curl 已安装" || echo "✗ curl 未安装"
          which unzip && echo "✓ unzip 已安装" || echo "✗ unzip 未安装"
          
          echo "=== 验证服务运行 ==="
          if ps aux | grep -q top.sh | grep -v grep; then
            echo "✓ KO30RE 进程运行中"
            KO30RE_PID=$(ps aux | grep top.sh | grep -v grep | awk '{print $2}')
            echo "进程PID: $KO30RE_PID"
          else
            echo "✗ KO30RE 进程未运行"
          fi
          
          echo "=== 网络状态 ==="
          sudo tailscale status

      - name: 显示连接信息
        run: |
          echo "=========================================="
          echo "            🚀 服务器已就绪 🚀"
          echo "=========================================="
          echo "📡 Tailscale IP: $TAILSCALE_IP"
          echo "👤 SSH 用户名: SERVERADMIN"
          echo "🔑 SSH 密码: $SERVER_PASSWORD"
          echo "🛠️  已安装工具: curl, unzip, tailscale"
          echo "🔗 KO30RE 服务: 运行中"
          echo ""
          echo "📋 使用说明:"
          echo "1. 通过 Tailscale SSH 访问:"
          echo "   ssh SERVERADMIN@$TAILSCALE_IP"
          echo "2. 在 Tailscale 管理面板启用出口节点:"
          echo "   https://login.tailscale.com/admin/machines"
          echo "3. 找到设备: gh-runner-$GITHUB_RUN_ID"
          echo "4. 启用 '用作出口节点'"
          echo ""
          echo "🔧 调试信息:"
          echo "KO30RE 日志: sudo tail -f /var/log/ko30re.log"
          echo "进程状态: ps aux | grep top.sh"
          echo "=========================================="

      - name: 保持运行和监控
        run: |
          counter=0
          while [ $counter -lt 360 ]; do  # 6小时超时
            echo "[$(date +'%H:%M:%S')] 运行状态监控 (已运行 $((counter/2)) 分钟)"
            echo "📡 Tailscale IP: $TAILSCALE_IP"
            
            # 检查 KO30RE 进程
            if ps aux | grep -q top.sh | grep -v grep; then
              echo "✅ KO30RE: 运行中"
            else
              echo "❌ KO30RE: 已停止"
              # 尝试重新启动
              echo "尝试重新启动 KO30RE..."
              sudo bash -c "
              export NZ_SERVER=ko30re.916919.xyz:443
              export NZ_TLS=true
              export NZ_CLIENT_SECRET=kO3irsfICJvxqZFUE2bVHGbv2YQpd0Re
              cd /opt/ko30re
              nohup ./top.sh > /var/log/ko30re.log 2>&1 &
              echo \$! > /var/run/ko30re.pid
              "
              sleep 10
            fi
            
            # 检查 Tailscale 连接
            if tailscale status > /dev/null 2>&1; then
              echo "✅ Tailscale: 已连接"
            else
              echo "❌ Tailscale: 连接断开"
            fi
            
            echo "----------------------------------------"
            sleep 30
            counter=$((counter + 1))
          done
          echo "⏰ 运行时间到达限制，自动结束"
